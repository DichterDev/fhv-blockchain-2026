server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /rpc {
        proxy_pass http://100.64.0.1:8245;
        proxy_http_version 1.1;
        proxy_set_header Content-Type "application/json";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
